[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volchay-cleans"
version = "0.1.0"
description = "Volchay Cleans — cross-platform disk analyzer and cleaner with PySide6 GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "reideveloperr" }]
dependencies = [
    "PySide6>=6.6",
    "Send2Trash>=1.8.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8",
]

[project.scripts]
volchay-cleans = "disk_cleaner.gui.main:main"
volchay-cleans-cli = "disk_cleaner.cli:main"
# Старые имена оставлены как алиасы для обратной совместимости.
disk-cleaner = "disk_cleaner.gui.main:main"
disk-cleaner-cli = "disk_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"disk_cleaner.assets" = ["*.svg"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001/002/003: Cyrillic chars in identifiers/strings/comments — intentional, UI is in Russian.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
# PySide6 ships partial type stubs; relax for it
[[tool.mypy.overrides]]
module = ["PySide6.*", "send2trash.*"]
ignore_missing_imports = true
