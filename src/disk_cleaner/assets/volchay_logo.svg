<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Volchay Cleans">
  <!--
    Volchay Cleans — стилизованная голова волка.
    Минималистичная форма из геометрических примитивов:
    острые уши, угловатая челюсть, V-образная морда.
    Единый цвет — Claude orange.
  -->
  <title>Volchay Cleans</title>
  <g fill="#CC785C" stroke="none">
    <!-- Силуэт головы вместе с ушами, нарисованный одной формой -->
    <path d="M 40 96
             L 56 36
             L 90 80
             Q 128 70 166 80
             L 200 36
             L 216 96
             L 220 138
             Q 214 174 192 198
             L 168 224
             Q 156 234 142 234
             L 138 222
             L 128 210
             L 118 222
             L 114 234
             Q 100 234 88 224
             L 64 198
             Q 42 174 36 138 Z"/>
  </g>

  <!-- Глаза: вытянутые миндалевидные, внешний угол приподнят (хищный взгляд) -->
  <g fill="#161616">
    <path d="M 88 132
             Q 102 124 118 138
             Q 116 148 100 148
             Q 88 144 88 132 Z"/>
    <path d="M 168 132
             Q 154 124 138 138
             Q 140 148 156 148
             Q 168 144 168 132 Z"/>
  </g>

  <!-- Маленький треугольный нос на конце морды -->
  <path d="M 122 188
           L 134 188
           L 128 198 Z" fill="#161616"/>
</svg>
