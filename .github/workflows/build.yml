name: Build Windows .exe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 (MSVC + Qt 6)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          # QtSvg ships in the base "essentials" install. QtMultimedia is an
          # add-on, requested explicitly here for the synthesised UI sounds.
          modules: 'qtmultimedia'
          cache: true

      - name: Configure with CMake
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release -j

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/Release/VolchayCleans.exe" $stage
          # install-qt-action exports QT_ROOT_DIR and adds Qt's bin/ to PATH.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$stage/VolchayCleans.exe"
          Get-ChildItem $stage -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolchayCleans-windows-x64
          path: stage/**
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: stage/**
